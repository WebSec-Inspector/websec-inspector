spring:
  application:
    name: websec-inspector
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:websec}
    username: ${DB_USER:websec}
    password: ${DB_PASSWORD:websec}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

websec:
  reports:
    email-enabled: ${WEBSEC_REPORTS_EMAIL_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-troque-este-segredo}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  refresh:
    cookie-secure: ${WEBSEC_REFRESH_COOKIE_SECURE:true}
  security:
    cors-origins: ${WEBSEC_CORS_ORIGINS:http://localhost:5173}
    dev-bypass-enabled: ${WEBSEC_DEV_BYPASS_ENABLED:false}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
