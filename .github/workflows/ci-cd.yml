name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: CI - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test backend
        working-directory: backend
        run: mvn -B test

  frontend:
    name: CI - Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  worker:
    name: CI - Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install dependencies
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Validate Python sources
        working-directory: worker
        run: python -m compileall -q .

  containers:
    name: CI - Containers
    needs:
      - backend
      - frontend
      - worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Validate production deployment
        env:
          SITE_HOST: validation.example.com
          POSTGRES_PASSWORD: validation-only
          JWT_SECRET: validation-only-not-a-production-secret
          IMAGE_TAG: sha-${{ github.sha }}
          RELEASE_DIR: ${{ github.workspace }}/infra/production
        run: |
          docker compose -f infra/production/compose.yml config --quiet
          bash -n infra/production/deploy.sh infra/production/backup.sh infra/production/bootstrap.sh
          python3 -m unittest discover -s infra/production/tests -v

      - name: Build application images
        run: docker compose build backend frontend worker

  publish:
    name: CD - Publish images
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs:
      - backend
      - frontend
      - worker
      - containers
    runs-on: ${{ vars.DEPLOY_ARCH == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: backend
            context: ./backend
            image: ghcr.io/websec-inspector/websec-inspector-backend

          - component: frontend
            context: ./frontend
            image: ghcr.io/websec-inspector/websec-inspector-frontend

          - component: worker
            context: ./worker
            image: ghcr.io/websec-inspector/websec-inspector-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.sha }}

      - name: Build and publish ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/${{ vars.DEPLOY_ARCH || 'amd64' }}
          build-args: |
            VITE_API_URL=/api
            APP_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: true
          sbom: true

  deploy:
    name: CD - Production VM
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4

      - name: Reject superseded automatic deployment
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$EVENT_NAME" == push && "$head" != "$REVISION" ]]; then
            echo 'Superseded commit: deployment skipped.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure verified SSH access
        if: steps.freshness.outputs.deploy == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vm_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vm_deploy ~/.ssh/known_hosts

      - name: Transfer immutable release and deploy
        if: steps.freshness.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/opt/websec-inspector/releases/.incoming-$REVISION-$RUN_ID"
          release="/opt/websec-inspector/releases/$REVISION"
          options=(-i ~/.ssh/vm_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          # Paths intentionally expand locally after validating SHA and run ID.
          # shellcheck disable=SC2029
          ssh "${options[@]}" "$destination" "mkdir -p '$incoming'"
          scp "${options[@]}" infra/production/{compose.yml,Caddyfile,deploy.sh,backup.sh} "$destination:$incoming/"
          # shellcheck disable=SC2029
          ssh "${options[@]}" "$destination" "set -e; if [ -d '$release' ]; then diff -r '$incoming' '$release'; rm -r '$incoming'; else mv '$incoming' '$release'; fi; bash '$release/deploy.sh' '$REVISION'"

      - name: Remove SSH identity
        if: always()
        run: rm -f ~/.ssh/vm_deploy ~/.ssh/known_hosts
